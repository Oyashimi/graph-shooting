<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数学グラフバトル！</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 上部：ゲーム画面 -->
    <div id="stage-wrap">
      <canvas id="board"></canvas>

      <!-- HUD -->
      <div id="hud">
        <div class="hud-item">STAGE <span id="hud-stage">1</span></div>
        <div class="hud-item">的 <span id="hud-hit">0</span>/<span id="hud-total">1</span></div>
        <div class="hud-item">SHOTS <span id="hud-shots">0</span></div>
        <div class="hud-item">SCORE <span id="hud-score">0</span></div>
      </div>

      <!-- 中央メッセージ（クリア演出など） -->
      <div id="message" class="hidden"></div>
    </div>

    <!-- 下部：入力フォーム -->
    <form id="input-bar" autocomplete="off">
      <div id="formula">
        <span class="lhs">y =</span>
        <input
          id="expr"
          type="text"
          inputmode="latin"
          maxlength="120"
          lang="en"
          name="expr-no-history"
          placeholder="例:  x^2   /   sin(x)   /   2*x+1   /   3/x"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          data-form-type="other"
        />
      </div>
      <button id="fire" type="submit">発射</button>
      <button id="next" type="button" class="hidden">次のステージ</button>
      <div id="err" class="hidden"></div>
    </form>
  </div>

  <!-- 関数評価のみ mathjs を利用（CDN）。SRIで配信物の改ざんを検知（不一致なら読み込み失敗） -->
  <script
    src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.js"
    integrity="sha384-LTEA4V0IswLrBgCFiDa/O0ZYiy0moUSxQ0toSl9p9CwKQwGTSjue1yH9d196jLUl"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script src="game.js"></script>
</body>
</html>
